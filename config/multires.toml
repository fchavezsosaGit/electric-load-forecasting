rolling_benchmark_max_cycles = 0
rolling_benchmark_bootstrap_samples = 400
rolling_benchmark_confidence_level = 0.95
calibration_splits = ["validate"]
evaluation_splits = ["test"]
max_cycles = 0
optimize_replayed_candidates = true
control_promotion_scope = "held_out_evaluation"
control_promotion_guard_enabled = true
control_promotion_guard_max_next_lock_regress_pct = 0.0
control_promotion_guard_max_peak_value_regress_pct = 0.0
control_promotion_guard_max_peak_miss_regress = 0.0
allow_baseline_candidates = true
candidate_pool_size = 2
