[paths]
outputs_multires_dir = "outputs/006_multires"
outputs_rollout_dir = "outputs/007_rollout"
outputs_horizon_curve_dir = "outputs/009_horizon_curve"
outputs_forecast_control_dir = "outputs/010_forecast_control"

[multires]
enabled = true
mode = "smoke"
comparison_mode = "matched_horizon"
resolutions = ["1s", "5s", "10s", "30s", "1min", "5min", "10min", "15min"]
horizons_minutes = [15, 30, 60, 120]
matched_strategies = ["recursive", "direct_endpoint"]
native_step_enabled = true
write_latest = true

[multires.profiles.smoke]
n_folds = 2
val_window_days = 2
origins_per_fold = 4
resolutions = ["30s", "1min"]
horizons_minutes = [15, 60]
feature_sets = ["minimal", "curated"]
model_labels = ["ridge-medium", "hgb-balanced", "xgb-balanced"]

[multires.profiles.candidate]
n_folds = 4
val_window_days = 2
origins_per_fold = 12
resolutions = ["10s", "30s", "1min", "5min", "10min", "15min"]
horizons_minutes = [15, 30, 60, 120]
feature_sets = ["minimal", "curated", "full_stable"]
model_labels = [
    "ridge-strong",
    "hgb-balanced",
    "hgb-frontier-lr010-l2001",
    "hgb-frontier-lr010-leaf100",
    "hgb-frontier-lr010-depth5-leaf100-l2001",
    "xgb-balanced",
    "xgb-frontier-lr010",
]

[multires.profiles.focus_60m]
n_folds = 3
val_window_days = 2
origins_per_fold = 4
resolutions = ["30s", "1min", "5min", "10min"]
horizons_minutes = [60]
feature_sets = ["minimal", "curated", "full_stable"]
model_labels = [
    "hgb-balanced",
    "hgb-frontier-lr010-l2001",
    "hgb-frontier-lr010-leaf100",
    "xgb-balanced",
]

[multires.profiles.subminute_focus]
n_folds = 3
val_window_days = 2
origins_per_fold = 8
resolutions = ["30s", "1min"]
horizons_minutes = [15, 60]
feature_sets = ["minimal", "curated", "full_stable"]
model_labels = [
    "hgb-balanced",
    "hgb-frontier-lr010-leaf100",
    "xgb-balanced",
]

[multires.profiles.full]
n_folds = 5
val_window_days = 2
origins_per_fold = 24
resolutions = ["1s", "5s", "10s", "30s", "1min", "5min", "10min", "15min"]
horizons_minutes = [15, 30, 60, 120]
feature_sets = ["minimal", "curated", "full_stable"]
model_labels = [
    "ridge-strong",
    "hgb-balanced",
    "hgb-frontier-lr010-l2001",
    "hgb-frontier-lr010-leaf100",
    "hgb-frontier-lr010-depth5-leaf100-l2001",
    "xgb-balanced",
    "xgb-frontier-lr010",
]

[multires.selection]
min_eval_coverage = 0.95
max_fold_std_mae_ratio = 0.20
min_practical_mae_gain_pct = 0.02
min_practical_rmse_gain_pct = 0.05
max_candidate_runtime_minutes = 30
pareto_enabled = true

[multires.baselines]
include_persistence = true
include_previous_day = true
include_avg_workday = true
include_anchored_workday = true
include_hybrid_workday = true

[multires.hybrid]
persistence_weight_start = 1.0
persistence_weight_end = 0.35
curve = "linear"

[multires.runtime]
max_parallel_jobs = 4
enable_cache = true
cache_mode = "disposable"
full_runtime_warning_minutes = 120
smoke_origins_per_fold = 4
candidate_origins_per_fold = 12
full_origins_per_fold = 24

[multires.rollout]
enabled = true
selected_resolution = "10min"
feature_set = "minimal"
model_label = "hgb-balanced"
horizon_minutes = 1440
strategy = "recursive"
origins_per_run = 8
origin_policy = "auto"
selection_target = "auto"

[multires.rollout_challengers]
enabled = true
max_candidates = 8
parallel_workers = 2
include_rollout_registry = true
include_stage6_registry = true
include_horizon_policy_candidates = true
include_config_default = true
origin_policies = ["phase_balanced", "uniform", "billing_aligned", "midnight"]
policy_resolutions = ["1min", "5min", "10min"]
recommendation_origin_scope = "requested_only"

[multires.rollout_learned_blends]
enabled = true
include_persistence_to_raw = true
include_persistence_to_residual = true
include_raw_to_residual = true
include_hybrid_phase_gate = true
persistence_weight_start = 0.90
persistence_weight_end = 0.20
raw_weight_start = 0.90
raw_weight_end = 0.20
hybrid_phase_gate_aligned_weight = 0.15
hybrid_phase_gate_non_aligned_weight = 0.75
refinement_enabled = true
refinement_step = 0.05
refinement_neighbors = 1
max_weights_per_family = 6
curve = "linear"

[multires.rollout_learned_blends.hybrid_phase_gate_bucket_weights]
"0" = 0.15
"300" = 0.90
"600" = 0.60

[multires.rollout_policy_candidates]
enabled = true
max_horizon_minutes = 15
selection_targets = ["endpoint_mae", "path_mae", "phase_mean_mae", "next_lock_mae"]

[multires.rollout_sweep_policies]
enabled = true
min_horizon_minutes = 30
max_horizon_minutes = 120
origin_policies = ["phase_balanced"]
selection_targets = ["next_lock_mae", "path_mae", "profile_shape_mae"]
min_source_candidates = 2
max_source_candidates = 3

[multires.horizon_curve]
enabled = true
horizons_minutes = [1, 15, 30, 60, 120, 240, 360, 720, 1440]
origins_per_run = 8
origin_policy = "auto"
selection_target = "auto"
max_candidates = 8
include_stage5_anchor = true
reuse_existing_sweeps = true
write_latest = true

[multires.forecast_control]
enabled = true
day_ahead_horizon_minutes = 1440
hourly_horizon_minutes = 60
phase_horizon_minutes = 15
nowcast_horizon_minutes = 1
day_ahead_refresh_enabled = true
day_ahead_refresh_interval_minutes = 60
day_ahead_refresh_candidate_label = "auto"
day_ahead_refresh_lookback_minutes = 120
day_ahead_refresh_residual_drift_mae_pct_threshold = 12.0
day_ahead_refresh_transition_mae_pct_threshold = 10.0
day_ahead_refresh_activity_ratio_shift_threshold = 0.18
day_ahead_refresh_threshold_quantiles = [0.50, 0.80, 0.95]
day_ahead_refresh_min_trigger_rate = 0.10
day_ahead_refresh_max_trigger_rate = 0.75
